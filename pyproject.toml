[project]
name = "voice-agent"
version = "0.1.0"
description = "Local voice-to-text dictation for Windows using NVIDIA Parakeet (ONNX)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pynput>=1.7",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "onnx-asr[cpu,hub]>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.gui-scripts]
voice-agent = "voice_agent.main:main"

[tool.setuptools.packages.find]
include = ["voice_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
